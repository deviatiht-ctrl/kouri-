<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Rekipere Modpas — KOURI</title>
  
  <link rel="icon" type="image/svg+xml" href="/assets/img/icon-placeholder.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background:#FFFFFF; min-height:100dvh; display:flex; flex-direction:column;">
  <div id="kouri-navbar"></div>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: clamp(80px, 12vw, 120px) 16px 40px 16px;">
    <div style="width:100%; max-width:440px;">
      <div style="text-align:left; margin-bottom: 24px;">
        <div data-kouri-logo data-logo-height="36" style="margin-bottom: 16px;">
          <img src="/assets/img/logo-placeholder.svg" alt="KOURI" style="height:36px;">
        </div>
        <h1 style="font-size: 2rem; margin-bottom: 8px;">Bliye modpas ou?</h1>
        <p style="font-size: 0.95rem;">Mete imèl kont ou pou w resevwa yon lyen re-inisyalizasyon.</p>
      </div>

      <div class="card" style="box-shadow: var(--shadow-md);">
        <form id="reset-form">
          <div class="form-group">
            <label class="form-label" for="reset-email">Adrès Imèl Kont Ou</label>
            <div class="input-with-icon">
              <i data-lucide="mail" class="input-icon"></i>
              <input type="email" id="reset-email" class="form-input" placeholder="ou@egzanp.ht" required autofocus>
            </div>
          </div>

          <button type="submit" id="btn-submit-reset" class="btn btn-primary btn-block btn-lg" style="margin-top: 12px;">
            <i data-lucide="send"></i>
            <span>Voye Lyen Rekiperasyon</span>
          </button>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align:center; font-size:0.9rem;">
          <a href="/login.html" style="font-weight:700; color:var(--ink);">Retounen nan Koneksyon</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align:center;">
      <div class="footer-credit" data-i18n="designed_by">Designed by Cvisual</div>
    </div>
  </footer>

  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/logo.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/navbar.js"></script>

  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const btn = document.getElementById('btn-submit-reset');

      btn.disabled = true;
      btn.innerHTML = `<span>N ap voye...</span>`;
      setTimeout(() => {
        showToast('success', 'Lyen Voye', `Nou voye yon imèl bay ${email}. Tanpri verifye bwat mesaj ou.`);
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send"></i> <span>Voye Lyen Rekiperasyon</span>`;
        if (window.lucide) window.lucide.createIcons();
      }, 1200);
    });
  </script>
</body>
</html>
