<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Pwofil Chofè — KOURI</title>

  <link rel="icon" type="image/svg+xml" href="/assets/img/icon-placeholder.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/mobile-nav.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background:#FFFFFF; min-height:100dvh;">

  <div id="kouri-navbar"></div>

  <main style="padding-top: clamp(90px, 12vw, 130px); padding-bottom: 90px;">
    <div class="container container-narrow">
      
      <!-- Driver Profile Header with Avatar Upload -->
      <div class="card" style="margin-bottom: 24px; padding: 24px;">
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
          <div style="position:relative;">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=160" id="driver-avatar-img" style="width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid var(--border);" alt="Avatar">
            <label for="driver-avatar-input" style="position:absolute; bottom:0; right:0; width:28px; height:28px; border-radius:50%; background:var(--ink); color:#FFF; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Chanje foto">
              <i data-lucide="camera" style="width:14px; height:14px;"></i>
              <input type="file" id="driver-avatar-input" accept="image/*" style="display:none;">
            </label>
          </div>
          <div style="flex:1;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
              <span class="badge badge-success">Chofè Apwouve</span>
              <span class="badge badge-primary"><i data-lucide="star" style="width:12px; height:12px; fill:#FFF;"></i> 4.92</span>
            </div>
            <h2 style="font-size:1.5rem; margin-bottom:2px;">Mackenzy Pierre</h2>
            <div style="color:var(--text-muted); font-size:0.875rem;">+509 4811-2233 • chofe@kouri.ht</div>
          </div>
        </div>
      </div>

      <!-- Vehicle Information Details -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header">
          <h3 style="font-size:1.15rem;">Machin ki anrejistre</h3>
          <span class="badge badge-accent">Kouri Klasik</span>
        </div>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:14px; font-size:0.875rem;">
          <div>
            <div style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase;">Mak ak Modèl</div>
            <div style="font-weight:700;">Toyota Corolla</div>
          </div>
          <div>
            <div style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase;">Ane Fabrikasyon</div>
            <div style="font-weight:700;">2018</div>
          </div>
          <div>
            <div style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase;">Koulè</div>
            <div style="font-weight:700;">Nwa (Black Metallic)</div>
          </div>
          <div>
            <div style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase;">Plak Imakrikilasyon</div>
            <div style="font-weight:800; font-family:var(--font-heading);">AA-12345</div>
          </div>
        </div>
      </div>

      <!-- Language & App Preferences -->
      <div class="card" style="margin-bottom:24px;">
        <h3 style="font-size:1.15rem; margin-bottom:14px;">Lang ak Notifikasyon</h3>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Lang pou Aplikasyon an</label>
          <select class="form-select" id="driver-lang" onchange="window.i18n.setLang(this.value)">
            <option value="ht">Kreyòl Ayisyen (HT)</option>
            <option value="fr">Français (FR)</option>
            <option value="en">English (EN)</option>
          </select>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border);">
          <div>
            <div style="font-weight:600; font-size:0.9rem;">Son alèt pou kous</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">Jwe yon son espesyal lè yon nouvo kous rive</div>
          </div>
          <input type="checkbox" checked style="width:20px; height:20px; accent-color:var(--accent);">
        </div>
      </div>

      <!-- Logout -->
      <div>
        <button type="button" class="btn btn-danger btn-block btn-lg" onclick="window.authService.signOut()">
          <i data-lucide="log-out"></i>
          <span data-i18n="nav_logout">Dekonekte</span>
        </button>
      </div>

    </div>
  </main>

  <div id="kouri-mobile-nav"></div>

  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/logo.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/navbar.js"></script>

  <script>
    document.getElementById('driver-lang').value = window.i18n.getLang();
    document.getElementById('driver-avatar-input')?.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (re) => {
          document.getElementById('driver-avatar-img').src = re.target.result;
          showToast('success', 'Foto Chanje', 'Nouvo foto ou anrejistre.');
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
